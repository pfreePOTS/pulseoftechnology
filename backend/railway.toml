# Backend service — Railway root directory MUST be `backend/` (this folder).
# If root is the monorepo, Railway falls back to Railpack and the API crashes
# (`from .config` relative import). See `railway/README.md`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

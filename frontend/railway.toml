# Frontend service — Railway root directory MUST be `frontend/` (this folder).
# If root is the monorepo, Railway falls back to Railpack. See `railway/README.md`.
# Build args NEXT_PUBLIC_* must be configured in Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Backend service — set Railway service root directory to `backend/` (this folder).
# See repository `railway/README.md` for variables and Postgres wiring.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

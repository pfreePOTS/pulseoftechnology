name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# GitHub Actions: run JS-based actions on Node 24 (Node 20 runner deprecation).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest with coverage
        run: pytest --cov=. --cov-report=term-missing

  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8100/health && curl -sf -o /dev/null http://localhost:3100 && exit 0
            sleep 2
          done
          echo "Services did not become ready in time"
          docker compose logs
          exit 1
      - name: Run DB migrations
        run: docker compose exec -T -w /app/backend backend alembic upgrade head
      # Bootstrap runs at API startup; after first migrate the admin_users table exists empty.
      - name: Restart backend (first admin bootstrap after migrations)
        run: docker compose restart backend
      - name: Wait for API after restart
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && exit 0
            sleep 2
          done
          echo "Backend not ready after restart"
          docker compose logs backend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps and Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          PLAYWRIGHT_API_URL: http://localhost:8100
        run: npm run test:e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

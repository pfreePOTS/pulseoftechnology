# ============================================================
# IMPORTANT: Always start this project with Docker Compose.
#   docker compose up --build
# Do NOT run backend or frontend manually outside of Compose
# during development. See README.md for full instructions.
# ============================================================

services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_db}
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_DB:-pulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse_backend
    restart: unless-stopped
    environment:
      # Required so `import backend` resolves (code lives under /app/backend)
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse_user}:${POSTGRES_PASSWORD:-pulse_password}@db:5432/${POSTGRES_DB:-pulse_db}
      ENVIRONMENT: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100,http://127.0.0.1:3000,http://127.0.0.1:3100}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-only-set-ADMIN_JWT_SECRET-in-production}
      SUBSCRIBER_TOKEN_SECRET: ${SUBSCRIBER_TOKEN_SECRET:-dev-only-set-SUBSCRIBER_TOKEN_SECRET-in-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECOMMENDED_PATH_SYNTHESIS_IMAGES_ENABLED: ${RECOMMENDED_PATH_SYNTHESIS_IMAGES_ENABLED:-true}
      RECOMMENDED_PATH_SYNTHESIS_IMAGE_MODEL: ${RECOMMENDED_PATH_SYNTHESIS_IMAGE_MODEL:-gpt-image-1}
      RECOMMENDED_PATH_SYNTHESIS_IMAGE_SIZE: ${RECOMMENDED_PATH_SYNTHESIS_IMAGE_SIZE:-1536x1024}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-radar@pulseone.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-PulseOne Radar}
      SENDGRID_NEWSLETTER_TEMPLATE_ID: ${SENDGRID_NEWSLETTER_TEMPLATE_ID:-}
      CONTACT_FORM_TO_EMAIL: ${CONTACT_FORM_TO_EMAIL:-marketing@pulseone.com}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8100}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY:-}
      HUBSPOT_NEWSLETTER_LIST_ID: ${HUBSPOT_NEWSLETTER_LIST_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-pulseadmin}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-pulseoneadmin@pulseone.local}
      # Optional — signal intelligence / vectors (see backend/config.py)
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-pulseone-articles}
      TREND_WINDOW_DAYS: ${TREND_WINDOW_DAYS:-7}
      TREND_PRIOR_WINDOW_DAYS: ${TREND_PRIOR_WINDOW_DAYS:-7}
      ARTICLE_RETENTION_DAYS: ${ARTICLE_RETENTION_DAYS:-30}
      ARTICLE_ARCHIVE_ENABLED: ${ARTICLE_ARCHIVE_ENABLED:-true}
      ARTICLE_PIPELINE_MAX_PER_PASS: ${ARTICLE_PIPELINE_MAX_PER_PASS:-200}
      NEWSLETTER_TOP_INGEST_HOURS: ${NEWSLETTER_TOP_INGEST_HOURS:-24}
      NEWSLETTER_DEEP_DIVE_INGEST_HOURS: ${NEWSLETTER_DEEP_DIVE_INGEST_HOURS:-72}
      NEWSLETTER_ARTICLE_LOOKBACK_DAYS: ${NEWSLETTER_ARTICLE_LOOKBACK_DAYS:-4}
      NEWSLETTER_SEND_HOUR_UTC: ${NEWSLETTER_SEND_HOUR_UTC:-7}
      NEWSLETTER_SEND_MINUTE_UTC: ${NEWSLETTER_SEND_MINUTE_UTC:-0}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-true}
    ports:
      - "8100:8000"
    volumes:
      # Mount source for hot reload; node: trick keeps container-built deps intact
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse_frontend
    restart: unless-stopped
    environment:
      # Browser-facing API URL (host port maps backend 8000 → 8100)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      # Same-origin browser API via next.config.ts rewrites (fixes admin cookies under 127.0.0.1 / headless Chromium)
      BACKEND_PROXY_TARGET: http://backend:8000
      NEXT_PUBLIC_USE_RELATIVE_API: "1"
      # Next dev proxy default is 30s — `/api/recommended-path` (LLM) needs longer or you see ECONNRESET in frontend logs.
      NEXT_PROXY_TIMEOUT_MS: ${NEXT_PROXY_TIMEOUT_MS:-180000}
      # RSC/SSR fetches from inside this container — must use Compose service name, not localhost
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000}
    ports:
      - "3100:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Prevent host node_modules from shadowing container's
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

# Frontend service — set Railway service root directory to `frontend/` (this folder).
# See repository `railway/README.md`. Build args NEXT_PUBLIC_* must be configured in Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
